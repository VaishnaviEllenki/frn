<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Donor Login - Food Rescue Network</title>
    <link rel="stylesheet" href="main.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body style="justify-content: center; align-items: center; min-height: 100vh;">
    <div class="glass-card" style="width: 100%; max-width: 400px; text-align: center; margin: 2rem;">
        <h2 style="color: var(--primary-color); margin-bottom: 2rem;"><i class="fa-solid fa-user-heart"></i> Donor Login</h2>
        <form action="donordash.html" method="GET" style="text-align: left;">
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" name="email" class="form-control" placeholder="Enter your email" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" name="password" class="form-control" placeholder="Enter your password" required>
            </div>
            <button type="submit" class="btn btn-primary btn-block" style="margin-top: 1rem;">Login</button>
        </form>
        <p style="margin-top: 1.5rem; font-size: 0.9rem; color: var(--text-muted);">
            Don't have an account? <a href="donorsign.html" style="color: var(--primary-color);">Sign Up</a>
        </p>
        <p style="margin-top: 0.5rem; font-size: 0.9rem;">
            <a href="forgotpassword.html" style="color: var(--text-muted);">Forgot Password?</a>
        </p>
        <p style="margin-top: 1rem; font-size: 0.8rem;">
            <a href="index.html" style="color: var(--text-muted);"><i class="fa-solid fa-arrow-left"></i> Back to Home</a>
        </p>
    </div>
</body>
</html>
