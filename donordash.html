<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Donor Dashboard - Food Rescue Network</title>
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <header class="glass-nav">
        <div class="nav-brand">
            <a href="index.html">
                <h1><i class="fa-solid fa-leaf"></i> FRN Donor Portal</h1>
            </a>
        </div>
        <button class="menu-toggle"><i class="fa-solid fa-bars"></i></button>
        <nav class="nav-links">
            <a href="index.html">Log Out <i class="fa-solid fa-right-from-bracket"></i></a>
        </nav>
    </header>

    <main class="container" style="max-width: 800px; margin-top: 2rem;">
        <div class="glass-card">
            <div class="dashboard-header">
                <h2 style="color: var(--primary-color);">Welcome, Donor!</h2>
                <p style="color: var(--text-muted);">Thank you for contributing to food rescue efforts. Please enter the details of your food donation below.</p>
            </div>
            
            <form action="submit_donation.php" method="POST" style="margin-top: 2rem;">
                <div class="grid-2">
                    <div class="form-group">
                        <label>Your Name</label>
                        <input type="text" name="name" class="form-control" placeholder="John Doe" required>
                    </div>
                    <div class="form-group">
                        <label>Email Address</label>
                        <input type="email" name="email" class="form-control" placeholder="john@example.com" required>
                    </div>
                    <div class="form-group">
                        <label>Phone Number</label>
                        <input type="tel" name="phone" class="form-control" placeholder="+1 234 567 8900" required>
                    </div>
                    <div class="form-group">
                        <label>Pickup Location</label>
                        <input type="text" name="location" class="form-control" placeholder="123 Main St, City" required>
                    </div>
                    <div class="form-group">
                        <label>Food Type</label>
                        <select name="food_type" class="form-control" style="background-color: var(--bg-color);" required>
                            <option value="">Select Food Type</option>
                            <option value="Fruits & Vegetables">Fruits & Vegetables</option>
                            <option value="Packed Meals">Packed Meals</option>
                            <option value="Bakery Items">Bakery Items</option>
                            <option value="Dairy Products">Dairy Products</option>
                            <option value="Others">Others</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Quantity (kg or units)</label>
                        <input type="number" name="quantity" class="form-control" placeholder="e.g. 5" required>
                    </div>
                </div>
                
                <div class="form-group" style="margin-top: 1rem;">
                    <label>Additional Information</label>
                    <textarea name="additional_info" class="form-control" placeholder="Any specific instructions for pickup?" rows="4"></textarea>
                </div>
                
                <div style="display: flex; gap: 1rem; margin-top: 2rem;">
                    <button type="submit" class="btn btn-primary btn-block">Submit Donation <i class="fa-solid fa-paper-plane"></i></button>
                    <button type="button" class="btn btn-outline btn-block" onclick="location.href='index.html'">Cancel</button>
                </div>
            </form>
        </div>
    </main>
    
    <script src="js/main.js"></script>
</body>
</html>
