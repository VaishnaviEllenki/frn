<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - Volunteer</title>
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body style="justify-content: center; align-items: center; min-height: 100vh;">
    <div class="glass-card" style="width: 100%; max-width: 400px; text-align: center; margin: 2rem;">
        <h2 style="color: var(--primary-color); margin-bottom: 2rem;"><i class="fa-solid fa-key"></i> Reset Password</h2>
        <p style="color: var(--text-muted); font-size: 0.9rem; margin-bottom: 1.5rem;">Enter your volunteer email address below and we'll send you a link to reset your password.</p>
        
        <form action="#" method="POST" style="text-align: left;">
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" name="email" class="form-control" placeholder="Enter your email" required>
            </div>
            <button type="submit" class="btn btn-primary btn-block" style="margin-top: 1rem;">Send Reset Link</button>
        </form>
        
        <p style="margin-top: 1.5rem; font-size: 0.9rem;">
            Remembered your password? <a href="volunteerlogin.html" style="color: var(--primary-color);">Log In</a>
        </p>
    </div>
</body>
</html>
