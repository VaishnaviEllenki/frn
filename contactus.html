<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - Food Rescue Network</title>
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <header class="glass-nav">
        <div class="nav-brand">
            <a href="index.html">
                <h1><i class="fa-solid fa-leaf"></i> Food Rescue Network</h1>
            </a>
        </div>
        <button class="menu-toggle"><i class="fa-solid fa-bars"></i></button>
        <nav class="nav-links">
            <a href="index.html">Home</a>
            <a href="howitworks.html">How It Works</a>
            <a href="getinvolved.html">Get Involved</a>
            <a href="blognews.html">Blog & News</a>
            <a href="contactus.html">Contact Us</a>
            <a href="feedback.html">Feedback</a>
        </nav>
    </header>

    <main class="container">
        <div class="glass-card fade-in" style="max-width: 600px; margin: 4rem auto; text-align: center;">
            <h2 style="color: var(--primary-color); margin-bottom: 2rem;"><i class="fa-solid fa-envelope"></i> Contact Us</h2>
            <p style="color: var(--text-muted); margin-bottom: 2rem;">Have questions or want to partner with us? We'd love to hear from you.</p>
            
            <form action="#" method="POST" style="text-align: left;">
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" name="name" class="form-control" placeholder="John Doe" required>
                </div>
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" name="email" class="form-control" placeholder="john@example.com" required>
                </div>
                <div class="form-group">
                    <label>Message</label>
                    <textarea name="message" class="form-control" rows="5" placeholder="How can we help you?" required></textarea>
                </div>
                <button type="submit" class="btn btn-primary btn-block" style="margin-top: 1rem;">Send Message <i class="fa-solid fa-paper-plane"></i></button>
            </form>
            
            <div style="margin-top: 3rem; border-top: 1px solid var(--glass-border); padding-top: 2rem;">
                <h3 style="margin-bottom: 1rem; color: var(--text-color);">Other Ways to Reach Us</h3>
                <p style="color: var(--text-muted);"><i class="fa-solid fa-envelope" style="color: var(--primary-color);"></i> foodrescuenetwork@gmail.com</p>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 Food Rescue Network. Dedicated to reducing food waste.</p>
    </footer>

    <script src="js/main.js"></script>
</body>
</html>
